<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Purple to Blue Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af40ff" />
      <stop offset="100%" stop-color="#5b42f3" />
    </linearGradient>
    
    <!-- Pink to Deep Purple Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cb218e" />
      <stop offset="100%" stop-color="#6617cb" />
    </linearGradient>
    
    <!-- Golden Yellow Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbdc65" />
      <stop offset="100%" stop-color="#fada5e" />
    </linearGradient>
  </defs>

  <!-- Audio Soundwaves emitting from the beak -->
  <path d="M 50 20 A 8 8 0 0 1 50 32" fill="none" stroke="#00ddeb" stroke-width="3" stroke-linecap="round"/>
  <path d="M 55 15 A 14 14 0 0 1 55 37" fill="none" stroke="#405cf5" stroke-width="3" stroke-linecap="round"/>

  <!-- Golden Parrot Beak -->
  <path d="M 34 20 L 48 26 L 36 34 Z" fill="url(#beakGrad)" />

  <!-- Abstract Parrot Body -->
  <path d="M 22 14 C 34 14 40 22 40 32 C 40 46 32 54 22 54 C 12 54 8 44 8 32 C 8 20 14 14 22 14 Z" fill="url(#bodyGrad)" />

  <!-- Folded Wing -->
  <path d="M 12 32 C 18 32 28 36 28 46 C 28 52 24 54 22 54 C 14 54 12 40 12 32 Z" fill="url(#wingGrad)" />

  <!-- Eye -->
  <circle cx="28" cy="24" r="3" fill="#18191a" />
  <circle cx="29" cy="23" r="1" fill="#ffffff" />
  
  <!-- Subtle learning spark/star -->
  <polygon points="12,12 14,7 16,12 21,14 16,16 14,21 12,16 7,14" fill="url(#beakGrad)" opacity="0.8"/>
</svg>
